<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>最速出身地当て</title>
    <style>
      .phase:not(.phase-active) {
        display: none;
      }
    </style>
    <script defer src="index.js"></script>

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="最速出身地当て" />
    <meta
      name="twitter:description"
      content="最速で出身地を当てます！質問は一回だけ！"
    />
  </head>
  <body>
    <h1>最速出身地当て</h1>
    <div class="phase phase-active">
      <p>最速で出身地を当てます！質問は一回だけ！</p>
      <button id="start">スタート</button>
    </div>
    <div class="phase">
      <p>貴方の出身地を入力してください。</p>
      <input type="text" id="input" />
      <button id="submit">送信</button>
    </div>
    <div class="phase">
      <p>貴方の出身地は<span id="result"></span>です！</p>
      <button id="restart">もう一度</button>
    </div>

    <hr />
    <div>
      Respect:
      <a href="https://hutinoatari.github.io/cheapTransfer/">最安経路検索</a>
      <br />
      Made by:
      <a href="https://sevenc7c.com">Nanashi.</a> <br />
    </div>
  </body>
</html>
